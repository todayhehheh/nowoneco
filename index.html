<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>지구를 시언하게</title>

  <!-- SEO / 카카오 공유 메타태그 -->
  <meta name="description" content="노원구꿈드림 환경동아리가 만든 환경 실천 페이지예요. 오늘 미션 하나만 해봐요!">
  <meta property="og:title" content="지구를 시언하게">
  <meta property="og:description" content="저희가 어른들한테 부탁이 있어요. 오늘 미션 하나만 해봐요 🌱">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://todayhehheh.github.io/nowoneco/">
  <meta name="theme-color" content="#ffffff">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="지구를 시언하게">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap"></noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════════════════════════════════════
     STORY LAYER
══════════════════════════════════════════════ -->
<div id="story">
  <button class="s-skip" id="s-skip">건너뛰기</button>
  <div class="s-progress" id="s-progress"></div>
  <div id="s-content"></div>
</div>

<!-- ══════════════════════════════════════════════
     APP LAYER
══════════════════════════════════════════════ -->
<div id="app">
  <header id="app-hdr">
    <div class="hdr-logo">
      지구를 시언하게
      <div class="hdr-logo-dot"></div>
    </div>
    <div class="hdr-date" id="hdr-date"></div>
  </header>

  <main id="app-main">
    <!-- 미션 -->
    <div id="tab-mission" class="tab-pane active">
      <div class="pane-pad">
        <div class="today-card" id="today-card"></div>
        <div class="day-tabs" id="day-tabs"></div>
        <div id="mission-cards"></div>
      </div>
    </div>

    <!-- 피드 -->
    <div id="tab-feed" class="tab-pane">
      <div class="pane-pad">
        <div class="pane-heading">환경보호 함께 해요!</div>
        <button class="feed-upload-btn" id="feed-upload-btn">📸 미션 참여하기</button>
        <div id="posts-container">
          <div class="loader"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
        </div>
      </div>
    </div>

    <!-- 활동 -->
    <div id="tab-gallery" class="tab-pane">
      <div class="pane-pad">
        <div class="pane-heading">저희의 활동이에요!</div>
        <div class="pane-sub">동아리가 직접 찍은 사진이에요 🌿</div>
        <div class="gallery-year-tabs" id="gallery-year-tabs">
          <button class="gallery-year-tab active" data-year="current" id="gallery-tab-current">올해 활동</button>
          <button class="gallery-year-tab" data-year="prev">이전 활동</button>
        </div>
        <div id="gallery-container-current">
          <div class="loader"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
        </div>
        <div id="gallery-container-prev" style="display:none">
          <div class="loader"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
        </div>
      </div>
    </div>

    <!-- 소개 -->
    <div id="tab-about" class="tab-pane">
      <div class="pane-pad">
        <div class="about-hero">
          <img src="img/소개.jpg" alt="동아리 소개" class="about-photo">
        </div>
        <div class="about-row" id="replay-story-btn">
          <span>인트로 다시 보기</span>
          <span class="about-row-icon">▶</span>
        </div>
      </div>
    </div>
  </main>

  <nav id="bot-nav">
    <button class="nav-btn active" data-tab="mission">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21C12 21 4 15 4 9a8 8 0 0 1 16 0c0 6-8 12-8 12z"/>
        <circle cx="12" cy="9" r="2.2" fill="currentColor" stroke="none"/>
      </svg>
      <span class="nav-label">오늘의 미션</span>
    </button>
    <button class="nav-btn" data-tab="feed">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.2"/>
        <rect x="14" y="3" width="7" height="7" rx="1.2"/>
        <rect x="3" y="14" width="7" height="7" rx="1.2"/>
        <rect x="14" y="14" width="7" height="7" rx="1.2"/>
      </svg>
      <span class="nav-label">미션</span>
    </button>
    <button class="nav-btn" data-tab="gallery">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21,15 16,10 5,21"/>
      </svg>
      <span class="nav-label">활동</span>
    </button>
    <button class="nav-btn" data-tab="about">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span class="nav-label">소개</span>
    </button>
  </nav>
</div>


<!-- ══ UPLOAD SHEET ══════════════════════════════ -->
<div id="upload-overlay">
  <div id="upload-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">나도 해봤어요! 📸</div>
    <label for="file-input">
      <div class="upload-drop" id="upload-drop">
        <img id="preview-img" alt="">
        <div class="upload-hint" id="drop-hint">
          <div class="upload-hint-icon">📷</div>
          <div class="upload-hint-text">사진을 눌러서 선택해주세요</div>
        </div>
      </div>
    </label>
    <input type="file" id="file-input" accept="image/*">
    <textarea class="upload-textarea" id="upload-text" rows="2" maxlength="80"
      placeholder="오늘 한 일을 한 줄로 써주세요 (최대 80자)"></textarea>
    <div class="char-count"><span id="char-count">0</span>/80</div>
    <button class="btn-primary" id="submit-btn" disabled>올리기</button>
    <div class="upload-notice">검토 후 게시됩니다 🌿</div>
  </div>
</div>

<!-- ══ ADMIN PANEL ════════════════════════════════ -->
<div id="admin-panel">
  <div class="admin-box">
    <button class="admin-close" id="admin-close">✕</button>
    <div class="admin-title">🔐 관리자 페이지</div>
    <div id="admin-login-wrap">
      <div class="admin-form">
        <input type="password" class="admin-input" id="admin-pw" placeholder="비밀번호를 입력하세요">
        <button class="btn-primary" id="admin-login-btn">로그인</button>
      </div>
    </div>
    <div id="admin-content" style="display:none">
      <!-- 관리자 내부 탭 -->
      <div class="admin-tabs">
        <button class="admin-tab active" data-section="posts">게시물 승인</button>
        <button class="admin-tab" data-section="approved">게시물 관리</button>
        <button class="admin-tab" data-section="gallery">갤러리 관리</button>
      </div>

      <!-- 게시물 승인 -->
      <div id="admin-posts-section">
        <div class="pending-count" id="pending-count"></div>
        <div id="pending-list"></div>
      </div>

      <!-- 게시물 관리 (승인된 글) -->
      <div id="admin-approved-section" style="display:none">
        <div class="pending-count" id="approved-count"></div>
        <div class="adm-dow-tabs" id="adm-dow-tabs">
          <button class="adm-dow-tab active" data-dow="-1">전체</button>
          <button class="adm-dow-tab" data-dow="1">월</button>
          <button class="adm-dow-tab" data-dow="2">화</button>
          <button class="adm-dow-tab" data-dow="3">수</button>
          <button class="adm-dow-tab" data-dow="4">목</button>
          <button class="adm-dow-tab" data-dow="5">금</button>
          <button class="adm-dow-tab" data-dow="6">토</button>
          <button class="adm-dow-tab" data-dow="0">일</button>
        </div>
        <div id="approved-list"></div>
      </div>

      <!-- 갤러리 관리 -->
      <div id="admin-gallery-section" style="display:none">
        <!-- 추가 폼 -->
        <button class="gallery-add-btn" id="gallery-add-toggle">＋ 새 활동 추가</button>
        <div class="gallery-form-wrap" id="gallery-form-wrap" style="display:none">
          <label for="gallery-file">
            <div class="upload-drop" id="gallery-drop" style="aspect-ratio:4/3;margin-bottom:10px">
              <img id="gallery-preview" alt="">
              <div class="upload-hint" id="gallery-hint">
                <div class="upload-hint-icon">📷</div>
                <div class="upload-hint-text">사진 선택</div>
              </div>
            </div>
          </label>
          <input type="file" id="gallery-file" accept="image/*">
          <label class="form-label">활동 날짜</label>
          <input type="date" class="form-input" id="gallery-date" style="margin-bottom:8px">
          <label class="form-label">활동 내용</label>
          <input type="text" class="form-input" id="gallery-caption"
            placeholder="예: 분리수거 캠페인" maxlength="40" style="margin-bottom:12px">
          <button class="btn-primary" id="gallery-save-btn" disabled>저장하기</button>
        </div>

        <!-- 목록 -->
        <div id="gallery-admin-list">
          <div class="loader"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 라이트박스 -->
<div id="lightbox">
  <button id="lightbox-close">✕</button>
  <img id="lightbox-img" alt="">
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
